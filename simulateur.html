<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console d'Infrastructure - Nexus IT Labs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        canvas { user-select: none; -webkit-user-select: none; }
        /* Scrollbar custom pour le panneau de droite */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen flex overflow-hidden selection:bg-indigo-500">

    <!-- ========================================== -->
    <!-- BARRE D'OUTILS LATÉRALE (GAUCHE)           -->
    <!-- ========================================== -->
    <aside class="w-20 md:w-64 bg-slate-800 border-r border-slate-700 flex flex-col z-20 shadow-2xl shrink-0">
        <div class="h-16 flex items-center justify-center md:justify-start md:px-6 border-b border-slate-700 bg-slate-900">
            <a href="dashboard.html" class="text-slate-400 hover:text-white transition flex items-center" title="Retour">
                <svg class="w-6 h-6 md:mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                <span class="hidden md:inline font-bold">Quitter le Lab</span>
            </a>
        </div>

        <div class="p-4 flex-1 overflow-y-auto space-y-6">
            
            <!-- Catégorie : Connexions -->
            <div>
                <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3 hidden md:block">Connexions</h2>
                <button id="tool-cable" class="tool-btn w-full flex flex-col md:flex-row items-center justify-center md:justify-start p-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 transition border-2 border-transparent hover:border-amber-500 group">
                    <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center border-2 border-slate-600 group-hover:border-amber-500 md:mr-3 transition">
                        <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    </div>
                    <div class="hidden md:block text-left">
                        <span class="block font-bold text-sm text-white">Câble Cuivre</span>
                        <span class="block text-[10px] text-slate-400">Relier 2 équipements</span>
                    </div>
                </button>
            </div>

            <!-- Catégorie : Équipements -->
            <div>
                <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-wider mb-3 hidden md:block">Équipements Réseau</h2>
                <div class="space-y-3">
                    <button id="tool-router" class="tool-btn w-full flex flex-col md:flex-row items-center justify-center md:justify-start p-3 rounded-xl bg-indigo-600 text-white shadow-md transition border-2 border-indigo-400">
                        <div class="w-10 h-10 rounded-full bg-slate-900 flex items-center justify-center border-2 border-indigo-400 md:mr-3">
                            <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                        </div>
                        <div class="hidden md:block text-left">
                            <span class="block font-bold text-sm">Routeur Cisco</span>
                            <span class="block text-[10px] text-indigo-200">Routage L3</span>
                        </div>
                    </button>

                    <button id="tool-switch" class="tool-btn w-full flex flex-col md:flex-row items-center justify-center md:justify-start p-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 transition border-2 border-transparent hover:border-emerald-500 group">
                        <div class="w-10 h-10 rounded bg-slate-800 flex items-center justify-center border-2 border-slate-600 group-hover:border-emerald-500 md:mr-3 transition">
                            <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
                        </div>
                        <div class="hidden md:block text-left">
                            <span class="block font-bold text-sm text-white">Switch 24 Ports</span>
                            <span class="block text-[10px] text-slate-400">Commutation L2</span>
                        </div>
                    </button>

                    <button id="tool-pc" class="tool-btn w-full flex flex-col md:flex-row items-center justify-center md:justify-start p-3 rounded-xl bg-slate-700 hover:bg-slate-600 text-slate-300 transition border-2 border-transparent hover:border-slate-400 group">
                        <div class="w-10 h-10 rounded bg-slate-800 flex items-center justify-center border-2 border-slate-600 group-hover:border-slate-400 md:mr-3 transition">
                            <svg class="w-5 h-5 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        </div>
                        <div class="hidden md:block text-left">
                            <span class="block font-bold text-sm text
